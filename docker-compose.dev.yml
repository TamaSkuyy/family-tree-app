services:
  backend:
    build:
      context: ./backend
      target: builder
    command: go run ./cmd/main.go
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    environment:
      - ENV=development
      - JWT_SECRET=dev-secret
      - PUBLIC_MODE=true
    working_dir: /app

  frontend:
    image: node:22-alpine
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    working_dir: /app
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api/v1
