# Family Tree App — reverse-proxy vhost for a host nginx that is already running.
#
# Use this when ports 80/443 are taken by your own nginx (the Caddy container in
# docker-compose.prod.yml would not be able to bind them).
#
# Manual install (replace the domain and port):
#   sudo cp deploy/nginx-family-tree.conf /etc/nginx/sites-available/family-tree.conf
#   sudo sed -i 's/__DOMAIN__/family.example.com/; s/__APP_PORT__/8080/' \
#        /etc/nginx/sites-available/family-tree.conf
#   sudo ln -sf /etc/nginx/sites-available/family-tree.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then enable HTTPS (Certbot rewrites this file, adding the 443 block and the
# HTTP -> HTTPS redirect):
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d family.example.com --agree-tos -m you@example.com --redirect
#
# Or let the installer do all of the above:
#   sudo ./install-vps.sh --behind-nginx --port 8080 \
#        --domain family.example.com --email you@example.com --install-nginx-vhost

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Room for photo/notes payloads; lower it if you prefer.
    client_max_body_size 10m;

    # Everything (SPA, /api/*, /health, /swagger/*) is served by the app's own
    # nginx container, which already proxies the API paths to the Go backend.
    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
