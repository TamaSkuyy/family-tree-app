server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server, plus proxy_pass through a variable, make nginx
    # re-resolve the backend hostname per request (cached 10s). Without this, nginx
    # resolves "backend" once at startup and either refuses to boot when the
    # backend is not up yet, or keeps proxying to a stale IP after the backend
    # container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # No URI part in the variable, so the original request URI is forwarded as-is
    # (/api/v1/..., /health, /swagger/index.html ...).
    set $backend_upstream http://backend:8080;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    location /swagger/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
